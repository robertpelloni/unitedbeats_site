<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UnitedBeats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: "Inter", sans-serif;
        overflow: hidden;
      }

      .grain {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 100;
      }

      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        position: relative;
      }

      .logo {
        font-family: "Playfair Display", serif;
        font-size: clamp(2.5rem, 6vw, 5rem);
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #d4af37, #f5e6a3, #d4af37);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
        text-align: center;
        position: relative;
        z-index: 10;
      }

      .logo::after {
        content: "";
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #d4af37, transparent);
      }

      .tagline {
        font-size: clamp(0.75rem, 1.5vw, 1rem);
        font-weight: 300;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: #666;
        margin-bottom: 4rem;
        text-align: center;
        position: relative;
        z-index: 10;
      }

      .tag-cloud-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1000px;
      }

      .tag-cloud {
        position: relative;
        width: 600px;
        height: 600px;
        transform-style: preserve-3d;
        animation: rotate 40s linear infinite;
      }

      @keyframes rotate {
        from {
          transform: rotateY(0deg) rotateX(5deg);
        }
        to {
          transform: rotateY(360deg) rotateX(5deg);
        }
      }

      .tag {
        position: absolute;
        top: 50%;
        left: 50%;
        font-family: "Playfair Display", serif;
        white-space: nowrap;
        cursor: default;
        transition: all 0.3s ease;
        text-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
      }

      .tag:hover {
        text-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
      }

      .footer {
        position: fixed;
        bottom: 2rem;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.7rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #333;
        z-index: 10;
      }

      .footer a {
        color: #444;
        text-decoration: none;
        transition: color 0.3s;
      }

      .footer a:hover {
        color: #d4af37;
      }

      /* Ambient glow */
      .glow {
        position: fixed;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(212, 175, 55, 0.03) 0%,
          transparent 70%
        );
        pointer-events: none;
      }

      .glow-1 {
        top: -100px;
        right: -100px;
      }
      .glow-2 {
        bottom: -100px;
        left: -100px;
      }

      @media (max-width: 768px) {
        .tag-cloud {
          width: 350px;
          height: 350px;
        }
      }
    </style>
  </head>
  <body>
    <div class="grain"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="hero">
      <h1 class="logo">UnitedBeats</h1>
      <p class="tagline">The Collective</p>

      <div class="tag-cloud-container">
        <div class="tag-cloud" id="tagCloud"></div>
      </div>
    </div>

    <div class="footer">
      <a href="https://unitedbeats.org">unitedbeats.org</a>
      &nbsp;&middot;&nbsp;
      <a href="https://unitedbeats.net">unitedbeats.net</a>
      &nbsp;&middot;&nbsp;
      <a href="https://unitedbeats.site">unitedbeats.site</a>
    </div>

    <script>
      const names = [
        "Robert Pelloni",
        "Harry Korlous",
        "Lumbros Korlous",
        "Phil",
        "Michael",
        "Chris",
        "Danny",
        "Dave",
        "Dan",
        "Laura",
        "Julia",
        "Crystal",
        "Shonna",
        "Kim",
        "Brandon",
        "Ken",
        "Joey",
        "Joe",
        "Shannon",
        "Donny",
        "Addy",
        "Craig",
        "Adam",
        "Amanda",
        "Sommer",
        "T",
        "Jen",
        "Dale",
        "Cliff",
        "Christopher",
        "Jude",
        "Leah",
        "Jennifer",
        "James",
        "Alex",
        "Samson",
        "Cory",
        "John",
        "Austin",
        "Ana",
        "Mireille",
        "Niraj",
        "Eugene",
        "Nick",
        "Bryonna",
        "Sam",
        "Charles",
        "Jason",
      ];

      const cloud = document.getElementById("tagCloud");
      const tags = [];
      const numTags = names.length;

      // Distribute on sphere using golden spiral
      names.forEach((name, i) => {
        const el = document.createElement("div");
        el.className = "tag";
        el.textContent = name;

        const phi = Math.acos(-1 + (2 * i) / numTags);
        const theta = Math.sqrt(numTags * Math.PI) * phi;
        const radius = 250;

        const x = radius * Math.cos(theta) * Math.sin(phi);
        const y = radius * Math.sin(theta) * Math.sin(phi);
        const z = radius * Math.cos(phi);

        // Size based on z-depth
        const scale = 0.6 + ((z + radius) / (radius * 2)) * 0.8;
        const opacity = 0.3 + ((z + radius) / (radius * 2)) * 0.7;

        const sizes = [0.7, 0.85, 1, 1.15, 1.3];
        const size = sizes[i % sizes.length];

        el.style.fontSize = `${size}rem`;
        el.style.fontWeight = i < 3 ? "700" : "400";
        el.style.color = i < 3 ? "#d4af37" : `rgba(245, 245, 245, ${opacity})`;

        cloud.appendChild(el);
        tags.push({ el, x, y, z, radius, name });
      });

      // Animate rotation
      let angle = 0;
      function animate() {
        angle += 0.002;
        const cosA = Math.cos(angle);
        const sinA = Math.sin(angle);

        tags.forEach((tag) => {
          const x = tag.x * cosA - tag.z * sinA;
          const z = tag.x * sinA + tag.z * cosA;
          const y = tag.y;

          const scale = 0.6 + ((z + tag.radius) / (tag.radius * 2)) * 0.8;
          const opacity = 0.25 + ((z + tag.radius) / (tag.radius * 2)) * 0.75;

          tag.el.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
          tag.el.style.opacity = opacity;
          tag.el.style.zIndex = Math.round(z + tag.radius);
        });

        requestAnimationFrame(animate);
      }
      animate();

      // Mouse interaction
      document.addEventListener("mousemove", (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 20;
        const y = (e.clientY / window.innerHeight - 0.5) * 10;
        cloud.style.transform = `rotateX(${-y}deg) rotateY(${x}deg)`;
      });
    </script>
  </body>
</html>
