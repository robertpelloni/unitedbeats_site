<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnitedBeats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #000;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            cursor: crosshair;
        }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .hero {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 40px rgba(255,200,50,0.8), 0 0 80px rgba(255,100,0,0.4), 0 0 120px rgba(255,50,0,0.2);
            opacity: 0;
            animation: fadeIn 3s ease 5s forwards;
        }
        @keyframes fadeIn { to { opacity: 1; } }
        .tagline {
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            color: rgba(255,200,50,0.5);
            margin-top: 1rem;
            opacity: 0;
            animation: fadeIn 3s ease 6s forwards;
        }
        .footer {
            position: fixed;
            bottom: 2rem;
            left: 0; right: 0;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.2);
            z-index: 10;
            opacity: 0;
            animation: fadeIn 2s ease 7s forwards;
        }
        .footer a { color: rgba(255,200,50,0.4); text-decoration: none; }
        .footer a:hover { color: #ffd700; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="hero">
        <h1 class="logo">UnitedBeats</h1>
        <p class="tagline">The Collective</p>
    </div>
    <div class="footer">
        <a href="https://unitedbeats.org">unitedbeats.org</a>
        &nbsp;&middot;&nbsp;
        <a href="https://unitedbeats.net">unitedbeats.net</a>
        &nbsp;&middot;&nbsp;
        <a href="https://unitedbeats.site">unitedbeats.site</a>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W, H, cx, cy;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            cx = W / 2;
            cy = H / 2;
        }
        resize();
        window.addEventListener('resize', resize);

        const names = [
            'Robert Pelloni','Harry Korlous','Lumbros Korlous','Phil','Michael',
            'Chris','Danny','Dave','Dan','Laura','Julia','Crystal','Shonna',
            'Kim','Brandon','Ken','Joey','Joe','Shannon','Donny','Addy',
            'Craig','Adam','Amanda','Sommer','T','Jen','Dale','Cliff',
            'Christopher','Jude','Leah','Jennifer','James','Alex','Samson',
            'Cory','John','Austin','Ana','Mireille','Niraj','Eugene','Nick',
            'Bryonna','Sam','Charles','Jason','Hank','Matthew','Derek','Gregg'
        ];

        // Background stars
        const bgStars = Array.from({length: 400}, () => ({
            x: Math.random() * 2000 - 500,
            y: Math.random() * 2000 - 500,
            s: Math.random() * 2 + 0.5,
            o: Math.random(),
            tw: Math.random() * 6.28
        }));

        // Debris particles
        const debris = [];
        for (let i = 0; i < 200; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 8;
            debris.push({
                x: cx, y: cy,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: Math.random() * 3 + 1,
                life: 1,
                decay: 0.002 + Math.random() * 0.005,
                color: `hsl(${30 + Math.random() * 30}, 100%, ${50 + Math.random() * 50}%)`
            });
        }

        // Shockwave rings
        const shockwaves = [];
        for (let i = 0; i < 5; i++) {
            shockwaves.push({ radius: 0, speed: 3 + i * 2, opacity: 0.5 - i * 0.08, delay: i * 0.3 });
        }

        // Name particles
        const particles = names.map((name, i) => {
            const angle = (i / names.length) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
            const speed = 1.5 + Math.random() * 3;
            const colors = ['#ffd700','#ff6b35','#ff1493','#8a2be2','#00bfff','#ff4500','#7cfc00','#ff69b4','#00ced1','#ffa500','#ff6ec7','#7fffd4'];
            return {
                name, x: cx, y: cy,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                angle, size: 0.8 + Math.random() * 0.6,
                color: colors[i % colors.length],
                opacity: 0,
                delay: 1 + Math.random() * 2,
                trail: [],
                maxTrail: 20 + Math.floor(Math.random() * 20),
                phase: Math.random() * 6.28,
                wobble: 0.5 + Math.random() * 1.5,
                finalOrbit: 100 + Math.random() * 250,
                finalAngle: Math.random() * 6.28,
                finalSpeed: 0.0005 + Math.random() * 0.002
            };
        });

        let time = 0;
        let phase = 0; // 0=collapse, 1=explosion, 2=settle

        function drawNebula() {
            // Deep space
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);

            // Nebula glow
            for (let i = 0; i < 3; i++) {
                const g = ctx.createRadialGradient(cx + Math.sin(time*0.2+i)*100, cy + Math.cos(time*0.2+i)*80, 0, cx, cy, 600);
                g.addColorStop(0, `hsla(${(time*20+i*120)%360}, 80%, 20%, 0.02)`);
                g.addColorStop(1, 'transparent');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, W, H);
            }

            // Stars
            bgStars.forEach(s => {
                s.tw += 0.03;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.s, 0, 6.28);
                ctx.fillStyle = `rgba(255,255,255,${s.o * (0.4+0.6*Math.sin(s.tw))})`;
                ctx.fill();
            });
        }

        function drawStar(x, y, r, glow) {
            // Corona
            const corona = ctx.createRadialGradient(x, y, 0, x, y, r * 8 + glow);
            corona.addColorStop(0, 'rgba(255,255,255,0.9)');
            corona.addColorStop(0.1, 'rgba(255,220,100,0.6)');
            corona.addColorStop(0.3, 'rgba(255,150,50,0.3)');
            corona.addColorStop(0.6, 'rgba(255,80,20,0.1)');
            corona.addColorStop(1, 'transparent');
            ctx.fillStyle = corona;
            ctx.fillRect(x-r*10, y-r*10, r*20, r*20);

            // Spikes
            ctx.save();
            ctx.translate(x, y);
            for (let i = 0; i < 12; i++) {
                ctx.rotate(0.524);
                const len = r * 6 + glow * 2 + Math.sin(time*3+i) * r * 2;
                const g = ctx.createLinearGradient(0, 0, len, 0);
                g.addColorStop(0, 'rgba(255,220,100,0.8)');
                g.addColorStop(1, 'transparent');
                ctx.beginPath();
                ctx.moveTo(0, -1);
                ctx.lineTo(len, 0);
                ctx.lineTo(0, 1);
                ctx.fillStyle = g;
                ctx.fill();
            }
            ctx.restore();

            // Core
            const core = ctx.createRadialGradient(x, y, 0, x, y, r);
            core.addColorStop(0, '#fff');
            core.addColorStop(0.5, 'rgba(255,240,200,0.9)');
            core.addColorStop(1, 'rgba(255,200,100,0)');
            ctx.beginPath();
            ctx.arc(x, y, r, 0, 6.28);
            ctx.fillStyle = core;
            ctx.fill();
        }

        function drawShockwaves() {
            shockwaves.forEach(sw => {
                const t = time - sw.delay;
                if (t < 0) return;
                sw.radius = t * 200 * sw.speed;
                const o = Math.max(0, sw.opacity * (1 - t * 0.15));
                if (o <= 0) return;

                ctx.beginPath();
                ctx.arc(cx, cy, sw.radius, 0, 6.28);
                ctx.strokeStyle = `rgba(255,200,100,${o})`;
                ctx.lineWidth = 2 + (1 - t*0.1) * 8;
                ctx.stroke();

                // Inner glow
                ctx.beginPath();
                ctx.arc(cx, cy, sw.radius, 0, 6.28);
                ctx.strokeStyle = `rgba(255,255,255,${o * 0.5})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            });
        }

        function drawDebris() {
            debris.forEach(d => {
                if (time < 1.5) return;
                d.x += d.vx;
                d.y += d.vy;
                d.vx *= 0.995;
                d.vy *= 0.995;
                d.life -= d.decay;

                if (d.life > 0) {
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.size * d.life, 0, 6.28);
                    ctx.fillStyle = d.color;
                    ctx.globalAlpha = d.life * 0.7;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            });
        }

        function animate() {
            time += 0.016;
            drawNebula();

            // Phase transitions
            if (time < 2) phase = 0;
            else if (time < 4.5) phase = 1;
            else phase = 2;

            // Collapse phase
            if (phase === 0) {
                const collapse = Math.min(1, time / 2);
                const starR = 3 + collapse * 20 + Math.sin(time * 5) * collapse * 5;
                const glow = 10 + collapse * 40;
                drawStar(cx, cy, starR, glow);

                // Pre-explosion flicker
                if (time > 1.5) {
                    const flicker = Math.random() > 0.7 ? 1.5 : 1;
                    drawStar(cx, cy, starR * flicker, glow * flicker);
                }
            }

            // Explosion phase
            if (phase >= 1) {
                drawShockwaves();
                drawDebris();

                // Fading star
                if (phase === 1) {
                    const fade = 1 - (time - 2) / 2.5;
                    drawStar(cx, cy, 5 * fade, 30 * fade);
                }

                // Supernova flash
                if (time > 2 && time < 2.5) {
                    const flash = (time - 2) / 0.5;
                    ctx.fillStyle = `rgba(255,255,255,${(1-flash) * 0.3})`;
                    ctx.fillRect(0, 0, W, H);
                }
            }

            // Name particles
            particles.forEach(p => {
                if (time < p.delay) return;

                const age = time - p.delay;

                if (phase <= 1) {
                    // Explosion outward
                    const explosionForce = Math.min(1, age * 0.5);
                    p.x = cx + p.vx * age * 80 * explosionForce;
                    p.y = cy + p.vy * age * 80 * explosionForce;
                    p.opacity = Math.min(1, age * 0.5);
                } else {
                    // Settle into orbits
                    p.finalAngle += p.finalSpeed;
                    const wobbleX = Math.sin(time * p.wobble + p.phase) * 30;
                    const wobbleY = Math.cos(time * p.wobble * 0.7 + p.phase) * 30;
                    const tx = cx + Math.cos(p.finalAngle) * p.finalOrbit + wobbleX;
                    const ty = cy + Math.sin(p.finalAngle) * p.finalOrbit + wobbleY;
                    p.x += (tx - p.x) * 0.02;
                    p.y += (ty - p.y) * 0.02;
                    p.opacity = 0.7 + 0.3 * Math.sin(time * 2 + p.phase);
                }

                // Trail
                p.trail.push({x: p.x, y: p.y});
                if (p.trail.length > p.maxTrail) p.trail.shift();

                // Draw trail
                if (p.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(p.trail[0].x, p.trail[0].y);
                    for (let i = 1; i < p.trail.length; i++) {
                        ctx.lineTo(p.trail[i].x, p.trail[i].y);
                    }
                    ctx.strokeStyle = p.color;
                    ctx.globalAlpha = p.opacity * 0.15;
                    ctx.lineWidth = p.size * 8;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }

                // Draw name
                ctx.save();
                ctx.globalAlpha = p.opacity;
                ctx.font = `bold ${p.size * 18}px 'Playfair Display', serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Glow
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 20;
                ctx.fillStyle = p.color;
                ctx.fillText(p.name, p.x, p.y);

                // Bright core
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fillText(p.name, p.x, p.y);

                ctx.restore();
            });

            // Cosmic dust connecting lines (in settle phase)
            if (phase === 2) {
                particles.forEach((p1, i) => {
                    particles.slice(i+1).forEach(p2 => {
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 200) {
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = `rgba(255,200,100,${(1-dist/200)*0.08})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    });
                });
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
